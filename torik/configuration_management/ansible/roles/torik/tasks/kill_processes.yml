---
# tasks/kill_processes.yml
# Stop all running Spectorious / flow processes before starting fresh ones.

- name: Kill Flow processes by name (SIGTERM)
  become: true
  ansible.builtin.shell: killall {{ item }} || true
  args:
    executable: /bin/bash
  loop:
    - "{{ flows_to_db_net_name }}"
    - "{{ flows_to_db_raw_name }}"
    - "{{ attacks_checker }}"
    - "{{ splitter_checker }}"
    - "{{ rotate_backup }}"
  changed_when: false


- name: Kill attacks_rt processes (SIGKILL)
  become: true
  ansible.builtin.shell: |
    ps -fe | grep attacks_rt | grep -v grep | awk '{print $2}' | xargs -t -I {} kill -9 {} || true
  args:
    executable: /bin/bash
  changed_when: false

- name: Kill flows_to_db_insert processes (SIGKILL)
  become: true
  ansible.builtin.shell: |
    ps -fe | grep flows_to_db_insert | grep -v grep | awk '{print $2}' | xargs -t -I {} kill -9 {} || true
  args:
    executable: /bin/bash
  changed_when: false

- name: Kill flow processes owned by root, excluding setup and goflow2 (SIGKILL)
  become: true
  ansible.builtin.shell: |
    ps -fe \
      | grep flow \
      | grep -v grep \
      | grep -v setup \
      | grep -v goflow2 \
      | grep root \
      | awk '{print $2}' \
      | xargs -t -I {} kill -9 {} || true
  args:
    executable: /bin/bash
  changed_when: false